{% extends 'base.html' %}{% block title %}Enviar para Recapagem{% endblock %}{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-header"><span class="card-title">Enviar para recapagem — {{ pneu.nome_display }}</span></div>
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label>Data de envio *</label><input type="date" name="data_envio" required value="{{ hoje.strftime('%Y-%m-%d') }}"></div>
        <div class="form-group"><label>KM no envio</label><input type="number" name="km_envio" min="0"></div>
        <div class="form-group"><label>Fornecedor / Recapadora</label>
          <div class="ss-wrap" data-catalog="fornecedoresRecap" data-hidden-name="fornecedor_id" data-placeholder="Buscar fornecedor..."></div>
        </div>
        <div class="form-group"><label>Custo (R$)</label><input type="number" name="custo" step="0.01" min="0"></div>
        <div class="form-group full"><label>Observações</label><textarea name="observacoes" rows="2"></textarea></div>
      </div>
      <div style="padding:12px 16px;background:#FFF1F0;border-radius:8px;font-size:13px;color:#c0241a;margin-top:8px;">
        ⚠ O pneu será desmontado automaticamente do veículo ao enviar para recapagem.
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
        <a href="{{ url_for('pneus.detalhe', id=pneu.id) }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Enviar para recapagem</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
window.SS_CATALOGS = window.SS_CATALOGS || {};
Object.assign(window.SS_CATALOGS, {
  fornecedoresRecap: [
    {% for f in fornecedores %}
    {id:"{{ f.id }}", nome:{{ f.razao_social | tojson }}}{% if not loop.last %},{% endif %}
    {% endfor %}
  ]
});
</script>
{% endblock %}
