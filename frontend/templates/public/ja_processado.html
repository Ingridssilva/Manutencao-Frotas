<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Já Processada</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,sans-serif;background:#F2F2F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border-radius:20px;max-width:480px;width:100%;padding:48px 40px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);}
h1{font-size:22px;font-weight:700;color:#1C1C1E;margin-bottom:8px;}
p{font-size:14px;color:#636366;line-height:1.6;}
.os-num{font-family:monospace;font-size:16px;color:#F7931E;margin:12px 0;}
.status{display:inline-block;margin-top:8px;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;}
.aprovada{background:#E8F9EE;color:#1a6e35;}
.rejeitada{background:#FFF1F0;color:#c0241a;}
</style></head><body><div class="card">
  <div style="font-size:48px;margin-bottom:16px;">ℹ️</div>
  <h1>OS Já Processada</h1>
  <div class="os-num">{{ o.numero }}</div>
  <p>Esta OS já foi processada anteriormente.</p>
  <div class="status {{ o.aprovacao_status }}">
    {{ 'APROVADA ✓' if o.aprovacao_status == 'aprovada' else 'REJEITADA' }}
  </div>
  {% if o.aprovacao_obs %}<p style="margin-top:12px;color:#48484A;">{{ o.aprovacao_obs }}</p>{% endif %}
</div></body></html>
