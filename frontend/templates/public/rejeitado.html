<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS Rejeitada</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,sans-serif;background:#F2F2F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border-radius:20px;max-width:480px;width:100%;padding:48px 40px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.icon{font-size:56px;margin-bottom:16px;}
h1{font-size:24px;font-weight:700;color:#c0241a;margin-bottom:8px;}
p{font-size:14px;color:#636366;line-height:1.6;margin-bottom:6px;}
strong{color:#1C1C1E;}
.os-num{font-family:monospace;font-size:18px;font-weight:700;color:#F7931E;margin:12px 0;}
.note{margin-top:20px;padding:12px 16px;background:#FFF1F0;border-radius:10px;font-size:13px;color:#c0241a;}
.footer{margin-top:28px;font-size:12px;color:#8E8E93;}</style>
</head><body><div class="card">
  <div class="icon">❌</div>
  <h1>OS Rejeitada</h1>
  <div class="os-num">{{ o.numero }}</div>
  <p>Veículo: <strong>{{ o.veiculo.placa if o.veiculo else '—' }}</strong></p>
  {% if o.aprovacao_obs %}<p style="margin-top:8px;color:#48484A;"><strong>Motivo:</strong> {{ o.aprovacao_obs }}</p>{% endif %}
  <div class="note">A OS foi reaberta para correção. O criador foi notificado.</div>
  <div class="footer">Sistema de Frota — Empresa Exemplo</div>
</div></body></html>
